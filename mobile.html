<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AuraDesk 手机端</title>
  <style>
    :root {
      --bg: #fff8ef;
      --card: rgba(255, 255, 255, 0.88);
      --pink: #ff8fc1;
      --rose: #ff6fa8;
      --purple: #9b7bea;
      --text: #684e62;
      --muted: #9a7f91;
      --line: rgba(255, 166, 205, .38);
      --shadow: rgba(135, 86, 135, .16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 185, 219, .48), transparent 28%),
        radial-gradient(circle at 86% 10%, rgba(209, 194, 255, .46), transparent 30%),
        linear-gradient(180deg, #fff7ed, #fffafd 55%, #f7f0ff);
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    }

    .app { max-width: 520px; margin: 0 auto; }
    .hero {
      border-radius: 28px;
      padding: 22px 18px;
      background: rgba(255,255,255,.64);
      box-shadow: 0 18px 42px var(--shadow);
      border: 1px solid rgba(255,255,255,.78);
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      right: -52px;
      top: -42px;
      background: radial-gradient(circle, rgba(255,143,193,.36), transparent 65%);
    }
    .badge {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      border-radius: 999px;
      padding: 7px 11px;
      background: #fff0f7;
      color: #8d5f7c;
      font-size: 12px;
      border: 1px solid var(--line);
    }
    h1 { margin: 14px 0 8px; font-size: 28px; letter-spacing: -.5px; }
    .desc { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
    .conn { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .conn-card {
      border-radius: 18px;
      background: rgba(255, 250, 253, .78);
      border: 1px solid var(--line);
      padding: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .conn-card b { display: block; color: var(--text); font-size: 15px; margin-top: 4px; word-break: break-all; }

    .mobile-companion {
      margin: 16px 0 2px;
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 12px;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .mini-stage {
      width: 104px;
      height: 104px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 12px 18px rgba(135, 86, 135, .18));
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mini-glow {
      position: absolute;
      bottom: 7px;
      width: 82px;
      height: 22px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 143, 193, .45), transparent 70%);
      animation: miniGlow 3.4s ease-in-out infinite;
    }
    .mini-avatar {
      position: relative;
      width: 88px;
      height: 92px;
      animation: miniFloat 3.4s ease-in-out infinite;
    }
    .mini-ear {
      position: absolute;
      top: 5px;
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fffdf8, #ffe3d0);
      box-shadow: inset -3px -3px 0 rgba(255, 193, 166, .2);
    }
    .mini-ear.left { left: 9px; }
    .mini-ear.right { right: 9px; }
    .mini-ear::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: #ffc7dd;
    }
    .mini-body {
      position: absolute;
      left: 9px;
      top: 18px;
      width: 70px;
      height: 72px;
      border-radius: 56% 56% 50% 50%;
      background: radial-gradient(circle at 34% 24%, #fffefa 0 20%, #fff8f2 21% 58%, #ffe5d5 100%);
      box-shadow: inset -5px -6px 0 rgba(255, 198, 174, .18), inset 4px 5px 0 rgba(255,255,255,.75);
      z-index: 2;
    }
    .mini-eye {
      position: absolute;
      top: 43px;
      width: 9px;
      height: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #fff 0 15%, #805eac 16% 45%, #44305e 46% 100%);
      z-index: 3;
      animation: miniBlink 5.2s infinite;
    }
    .mini-eye.left { left: 30px; }
    .mini-eye.right { right: 30px; }
    .mini-blush {
      position: absolute;
      top: 57px;
      width: 15px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 136, 174, .34);
      z-index: 3;
    }
    .mini-blush.left { left: 18px; }
    .mini-blush.right { right: 18px; }
    .mini-mouth {
      position: absolute;
      left: 39px;
      top: 56px;
      width: 10px;
      height: 6px;
      border: 2px solid #b7657d;
      border-top: 0;
      border-radius: 0 0 12px 12px;
      z-index: 3;
      transform-origin: center top;
    }
    .mini-paw {
      position: absolute;
      top: 63px;
      width: 18px;
      height: 17px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fffefa, #ffe4d5);
      z-index: 4;
    }
    .mini-paw.left { left: 14px; transform: rotate(12deg); }
    .mini-paw.right { right: 14px; transform: rotate(-12deg); }
    .mini-avatar.speaking { animation: miniTalkBody .42s ease-in-out infinite alternate; }
    .mini-avatar.speaking .mini-mouth {
      border: 0;
      left: 38px;
      top: 54px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #ff9cbd, #a43b5b 72%);
      animation: miniMouthTalk .16s ease-in-out infinite alternate;
    }
    .mini-avatar.happy .mini-eye {
      top: 48px;
      height: 6px;
      background: transparent;
      border-bottom: 3px solid #493161;
      border-radius: 0 0 18px 18px;
      animation: none;
    }
    .mini-avatar.alert { animation: miniAlert .68s ease-in-out infinite; }
    .mini-bubble {
      min-height: 58px;
      padding: 11px 13px;
      border-radius: 20px 20px 20px 8px;
      background: rgba(255, 250, 253, .92);
      border: 1px solid var(--line);
      box-shadow: 0 10px 22px rgba(119, 72, 129, .1);
      line-height: 1.55;
      color: #70546a;
      font-size: 13px;
    }
    .mini-bubble b { color: var(--rose); }
    @keyframes miniFloat { 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(-5px) rotate(.5deg); } }
    @keyframes miniGlow { 0%,100%{ opacity:.55; transform:scale(.94); } 50%{ opacity:.95; transform:scale(1.06); } }
    @keyframes miniBlink { 0%,91%,100%{ transform:scaleY(1); } 94%{ transform:scaleY(.08); } }
    @keyframes miniTalkBody { from{ transform: translateY(-1px) rotate(-.8deg); } to{ transform: translateY(-5px) rotate(.8deg); } }
    @keyframes miniMouthTalk { from{ transform: scaleY(.6) scaleX(1.1); } to{ transform: scaleY(1.12) scaleX(.9); } }
    @keyframes miniAlert { 0%,100%{ transform: translateY(0) scale(1); } 50%{ transform: translateY(-7px) scale(1.035); } }

    .section-title {
      margin: 22px 3px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .section-title h2 { margin: 0; font-size: 18px; }
    .pill {
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255,255,255,.72);
      color: var(--muted);
      font-size: 12px;
      border: 1px solid var(--line);
    }

    .card {
      border-radius: 24px;
      padding: 14px;
      background: var(--card);
      box-shadow: 0 14px 34px var(--shadow);
      border: 1px solid rgba(255,255,255,.8);
      backdrop-filter: blur(12px);
    }

    .form-grid { display: grid; gap: 10px; }
    label { font-size: 12px; color: var(--muted); margin-left: 4px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 13px;
      outline: none;
      color: var(--text);
      background: #fffafd;
      font-size: 15px;
      font-family: inherit;
    }
    textarea { min-height: 74px; resize: vertical; }
    .two { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 10px 20px rgba(255, 111, 168, .22);
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    button.secondary {
      color: #7c5872;
      background: #fff2f8;
      box-shadow: none;
      border: 1px solid var(--line);
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

    .list { display: grid; gap: 10px; }
    .item {
      border-radius: 20px;
      padding: 13px;
      background: rgba(255,255,255,.76);
      border: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }
    .item.done { opacity: .62; }
    .item-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .title { font-weight: 800; font-size: 16px; line-height: 1.35; }
    .time { color: var(--rose); font-size: 13px; white-space: nowrap; font-weight: 700; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .note { color: #7f6677; line-height: 1.6; font-size: 13px; }
    .item-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .item-actions button { padding: 8px 11px; font-size: 12px; }
    .empty { text-align: center; color: var(--muted); padding: 24px 10px; line-height: 1.7; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      transition: .22s ease;
      border-radius: 999px;
      padding: 11px 15px;
      background: rgba(105, 75, 98, .9);
      color: white;
      box-shadow: 0 10px 24px rgba(60, 36, 56, .22);
      pointer-events: none;
      max-width: calc(100vw - 34px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 390px) {
      .conn, .two, .actions { grid-template-columns: 1fr; }
      .mobile-companion { grid-template-columns: 92px 1fr; gap: 8px; }
      .mini-stage { width: 92px; height: 96px; transform: scale(.92); transform-origin: left center; }
      .mini-bubble { font-size: 12px; padding: 10px 11px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <span class="badge">📱 手机端与桌面同步</span>
      <h1>AuraDesk 手机控制台</h1>
      <p class="desc">在同一 Wi‑Fi 下，用手机新增提醒、查看提醒列表，并让桌面端小精灵同步播报。</p>
      <div class="mobile-companion">
        <div class="mini-stage" id="miniStage" title="点我和桌面小精灵打招呼">
          <div class="mini-glow"></div>
          <div class="mini-avatar happy" id="miniAvatar">
            <div class="mini-ear left"></div>
            <div class="mini-ear right"></div>
            <div class="mini-body"></div>
            <div class="mini-eye left"></div>
            <div class="mini-eye right"></div>
            <div class="mini-blush left"></div>
            <div class="mini-blush right"></div>
            <div class="mini-mouth"></div>
            <div class="mini-paw left"></div>
            <div class="mini-paw right"></div>
          </div>
        </div>
        <div class="mini-bubble" id="miniBubble"><b>Aura</b> 已经来到手机上啦。新增提醒后，我会帮你同步给电脑端。</div>
      </div>
      <div class="conn">
        <div class="conn-card">连接状态<b id="statusText">连接中...</b></div>
        <div class="conn-card">桌面地址<b id="hostText">-</b></div>
      </div>
    </section>

    <div class="section-title">
      <h2>新建提醒</h2>
      <span class="pill" id="pairText">配对中</span>
    </div>
    <section class="card">
      <form id="reminderForm" class="form-grid">
        <div>
          <label>提醒标题</label>
          <input id="titleInput" placeholder="例如：15:00 产品会议" required />
        </div>
        <div class="two">
          <div>
            <label>提醒时间</label>
            <input id="timeInput" type="datetime-local" />
          </div>
          <div>
            <label>类型</label>
            <select id="typeInput">
              <option>日程</option>
              <option>会议</option>
              <option>快递</option>
              <option>抢票</option>
              <option>喝水休息</option>
              <option>普通</option>
            </select>
          </div>
        </div>
        <div>
          <label>备注</label>
          <textarea id="noteInput" placeholder="可选：地点、链接、准备事项..."></textarea>
        </div>
        <button type="submit">保存并同步到桌面端</button>
      </form>
      <div class="actions">
        <button class="secondary" type="button" onclick="speakOnDesktop()">让桌面端播报</button>
        <button class="secondary" type="button" onclick="loadReminders()">刷新列表</button>
      </div>
    </section>

    <div class="section-title">
      <h2>提醒列表</h2>
      <span class="pill" id="countText">0 项</span>
    </div>
    <section class="card list" id="list"></section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const pairCode = params.get('code') || localStorage.getItem('auradeskPairCode') || '';
    if (pairCode) localStorage.setItem('auradeskPairCode', pairCode);

    const statusText = document.getElementById('statusText');
    const hostText = document.getElementById('hostText');
    const pairText = document.getElementById('pairText');
    const countText = document.getElementById('countText');
    const listEl = document.getElementById('list');
    const toastEl = document.getElementById('toast');
    const miniAvatar = document.getElementById('miniAvatar');
    const miniBubble = document.getElementById('miniBubble');
    const miniStage = document.getElementById('miniStage');
    let miniTimer = null;

    function setMiniState(state = 'happy', text = '') {
      clearTimeout(miniTimer);
      miniAvatar.className = `mini-avatar ${state}`;
      if (text) miniBubble.innerHTML = text;
      if (state === 'speaking') {
        miniTimer = setTimeout(() => {
          miniAvatar.className = 'mini-avatar happy';
        }, 1600);
      } else if (state === 'alert') {
        miniTimer = setTimeout(() => {
          miniAvatar.className = 'mini-avatar happy';
        }, 1300);
      }
    }

    function miniSay(text, state = 'speaking') {
      setMiniState(state, text);
    }

    function toast(text) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    function api(path, options = {}) {
      return fetch(path + (path.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(pairCode), {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'x-auradesk-code': pairCode,
          ...(options.headers || {})
        }
      }).then(async res => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.message || '请求失败');
        return data;
      });
    }

    function formatTime(value) {
      if (!value) return '未设置时间';
      try {
        const date = new Date(value);
        if (!Number.isNaN(date.getTime())) {
          return `${date.getMonth() + 1}月${date.getDate()}日 ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }
      } catch {}
      return value;
    }

    function render(reminders = []) {
      countText.textContent = `${reminders.length} 项`;
      if (!reminders.length) {
        listEl.innerHTML = '<div class="empty">还没有提醒。<br/>先新建一个，桌面端会同步收到哦。</div>';
        return;
      }
      listEl.innerHTML = reminders.map(item => `
        <article class="item ${item.done ? 'done' : ''}">
          <div class="item-top">
            <div class="title">${escapeHtml(item.title)}</div>
            <div class="time">${escapeHtml(formatTime(item.time))}</div>
          </div>
          <div class="meta"><span>🏷 ${escapeHtml(item.type || '普通')}</span><span>${item.done ? '已完成' : '待提醒'}</span></div>
          ${item.note ? `<div class="note">${escapeHtml(item.note)}</div>` : ''}
          <div class="item-actions">
            <button class="secondary" onclick="toggleDone('${item.id}', ${!item.done})">${item.done ? '恢复' : '完成'}</button>
            <button class="secondary" onclick="removeReminder('${item.id}')">删除</button>
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
    }

    async function loadStatus() {
      try {
        const data = await fetch('/api/status').then(res => res.json());
        statusText.textContent = '已连接';
        hostText.textContent = `${data.ip}:${data.port}`;
        pairText.textContent = pairCode ? `配对码 ${pairCode}` : '未带配对码';
        miniSay('<b>Aura</b> 已连接电脑端，我会帮你同步提醒。', 'happy');
      } catch (error) {
        statusText.textContent = '连接失败';
        miniSay('<b>Aura</b> 暂时连不上电脑端，请确认手机和 Mac 在同一个 Wi‑Fi。', 'alert');
      }
    }

    async function loadReminders() {
      try {
        const data = await api('/api/reminders');
        render(data.reminders || []);
      } catch (error) {
        toast(error.message);
        miniSay(`<b>Aura</b> 列表刷新失败：${escapeHtml(error.message)}`, 'alert');
      }
    }

    async function toggleDone(id, done) {
      try {
        const data = await api('/api/reminders/' + encodeURIComponent(id), {
          method: 'PATCH',
          body: JSON.stringify({ done })
        });
        render(data.reminders || []);
        miniSay(done ? '<b>Aura</b> 已标记完成啦，辛苦你了。' : '<b>Aura</b> 已恢复提醒，我继续帮你记着。', done ? 'happy' : 'speaking');
      } catch (error) {
        toast(error.message);
        miniSay(`<b>Aura</b> 同步状态失败：${escapeHtml(error.message)}`, 'alert');
      }
    }

    async function removeReminder(id) {
      try {
        const data = await api('/api/reminders/' + encodeURIComponent(id), { method: 'DELETE' });
        render(data.reminders || []);
        toast('已删除提醒');
        miniSay('<b>Aura</b> 已删除这个提醒。', 'speaking');
      } catch (error) {
        toast(error.message);
        miniSay(`<b>Aura</b> 删除失败：${escapeHtml(error.message)}`, 'alert');
      }
    }

    async function speakOnDesktop() {
      try {
        miniSay('<b>Aura</b> 我正在和电脑端小精灵打招呼...', 'speaking');
        await api('/api/desktop/speak', {
          method: 'POST',
          body: JSON.stringify({ text: '手机端已经连接成功，我会帮你同步提醒。', state: 'happy' })
        });
        toast('桌面端已播报');
        miniSay('<b>Aura</b> 电脑端已经收到我的声音啦。', 'happy');
      } catch (error) {
        toast(error.message);
        miniSay(`<b>Aura</b> 播报失败：${escapeHtml(error.message)}`, 'alert');
      }
    }

    miniStage.addEventListener('click', () => {
      speakOnDesktop();
    });

    document.getElementById('reminderForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const title = document.getElementById('titleInput').value.trim();
      const time = document.getElementById('timeInput').value;
      const type = document.getElementById('typeInput').value;
      const note = document.getElementById('noteInput').value.trim();
      if (!title) return toast('请输入提醒标题');
      try {
        const data = await api('/api/reminders', {
          method: 'POST',
          body: JSON.stringify({ title, time, type, note })
        });
        render(data.reminders || []);
        event.target.reset();
        toast('已同步到桌面端');
        miniSay(`<b>Aura</b> 已把「${escapeHtml(title)}」同步给电脑端啦。`, 'happy');
      } catch (error) {
        toast(error.message);
        miniSay(`<b>Aura</b> 同步失败：${escapeHtml(error.message)}`, 'alert');
      }
    });

    loadStatus();
    loadReminders();
    setInterval(loadReminders, 8000);
  </script>
</body>
</html>
